<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Projetos - Turma 202</title>
    <style>
        /* =========================================================
           CONFIGURAÇÕES GERAIS
           ========================================================= */

        @import url(https://dmletterstudio.com/product/melted-monster-halloween-pack-layered-font/);

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('diadosmortos.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            height: 100%;
            margin: 0;
            font-family: 'Melted Monster';
            /* Slate 900 (fundo escuro) */
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        /* =========================================================
           CABEÇALHO
           ========================================================= */
        .cabecalho {
            text-align: center;
            padding: 40px 20px;
            border-bottom: 1px #334155;
        }

        .cabecalho h1 {
            color: white;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        .cabecalho p {
            color: #94a3b8;
            font-size: 1.1rem;
        }

        /* =========================================================
           ÁREA PRINCIPAL (GALERIA COM FLEXBOX)
           ========================================================= */
        .galeria {
            flex: 1;
            /* Faz a galeria crescer e empurrar o rodapé */
            display: flex;
            flex-wrap: wrap;
            /* Permite que os cartões quebrem de linha se a tela for pequena */
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 50px 20px;
        }

        /* =========================================================
           OS CARTÕES DE PROJETO (CARDS)
           ========================================================= */
        .cartao {
            background-color: #1e293b;
            width: 320px;
            padding: 30px 20px;
            flex-grow: 1;
            border-radius: 12px;
            border: 2px dashed #ff7300;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Efeito ao passar o mouse por cima do cartão */
        .cartao:hover {
            transform: translateY(-8px);
            border-color: #c70707;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        .icone {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .cartao h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        /* =========================================================
           BOTÕES DE LINK
           ========================================================= */
        .btn-acessar {
            display: inline-block;
            background-color: #000000;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .btn-acessar:hover {
            background-color: #be0707;
        }

        /* =========================================================
           RODAPÉ
           ========================================================= */
        .rodape {
            text-align: center;
            padding: 20px;
            border-top: 1px  #334155;
            color: white;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <header class="cabecalho">
        <h1>💀🪦Trabalho sobre o Dia dos Mortos🪦💀</h1>
        <p>Portfólio de Projetos Interativos - Turma 202</p>
    </header>

    <main class="galeria">

        <!-- Projeto 1 -->
        <article class="cartao">
            <div class="icone">📖</div>
            <h2>História e Referências</h2>
            <a href="1-história/0-historia.html" class="btn-acessar">Abrir Projeto</a>
        </article>

        <!-- Projeto 2 -->
        <article class="cartao">
            <div class="icone">👷👷‍♀️</div>
            <h2>Funções</h2>
            <!-- Lembre-se de verificar se o nome do arquivo bate com o href abaixo -->
            <a href="2-funções/0-funcoes.html" class="btn-acessar">Abrir Projeto</a>
        </article>

        <!-- Projeto 3 -->
        <article class="cartao">
            <div class="icone">📋</div>
            <h2>Materiais</h2>
            <a href="3-materiais/0-materiais.html" class="btn-acessar">Abrir Projeto</a>
        </article>

        <!-- Projeto 4 -->
        <article class="cartao">
            <div class="icone">📋</div>
            <h2>Organização</h2>
            <a href="4-organização/0-organizacao.html" class="btn-acessar">Abrir Projeto</a>
        </article>




    </main>

    <footer class="rodape">
        <p>&copy; 2026 EEB Elfrida Cristino da Silva - Desenvolvido pela Turma 202</p>
    </footer>

</body>

</html>
